name: Affichage ou installation
description: Signaler un texte coupé, un souci visuel ou une difficulté d’installation.
body:
  - type: input
    id: version
    attributes:
      label: Version du patch
      description: Indiquez la version affichée sur la page de téléchargement.
    validations:
      required: true
  - type: input
    id: support
    attributes:
      label: Console ou émulateur
      placeholder: Par exemple PS Vita ou Vita3K
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Problème rencontré
      description: Indiquez l’écran ou l’étape d’installation concernés, les actions qui reproduisent le problème et ce qui s’affiche. Une capture ou le message d’erreur exact peut aider.
    validations:
      required: true
